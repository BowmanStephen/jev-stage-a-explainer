<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="100%" height="auto" role="img" aria-labelledby="title desc">
  <title id="title">Jev in one breath: scorer not essay bot</title>
  <desc id="desc">Left: chat bubble saying let me explain crossed out. Right: clipboard with checkboxes circled. Caption: Scorer, not essay bot.</desc>
  <style>
  .xd-bg { fill: #16140F; }
  .xd-box { fill: none; stroke: #EDE8DE; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .xd-box-fill { fill: #16140F; stroke: #EDE8DE; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .xd-dash { fill: none; stroke: #A8A29A; stroke-width: 1.8; stroke-dasharray: 6 5; stroke-linecap: round; }
  .xd-ink { fill: #EDE8DE; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .xd-muted { fill: #A8A29A; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .xd-rubric { fill: #E25545; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .xd-pass { fill: #6FBF8A; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .xd-stroke-rubric { stroke: #E25545; fill: none; stroke-width: 2.2; stroke-linecap: round; }
  .xd-stroke-pass { stroke: #6FBF8A; fill: none; stroke-width: 2.2; stroke-linecap: round; }
  .xd-fill-rubric { fill: none; stroke: #E25545; stroke-width: 2.2; }
  .xd-fill-pass { fill: none; stroke: #6FBF8A; stroke-width: 2.2; }
  .xd-caption { fill: #A8A29A; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-style: italic; }
  .xd-label { fill: #EDE8DE; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; }
  .xd-small { fill: #A8A29A; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; }
</style>
  <rect class="xd-bg" x="0" y="0" width="560" height="220" rx="8"/>

  <!-- Left: crossed-out chat bubble -->
  <g>
    <text class="xd-small" x="130" y="32" text-anchor="middle">Essay bot</text>
    <!-- bubble -->
    <path class="xd-box-fill" d="M40 48
      h180 a12 12 0 0 1 12 12
      v70 a12 12 0 0 1 -12 12
      h-100 l-18 22 -4 -22 h-58
      a12 12 0 0 1 -12 -12 v-70 a12 12 0 0 1 12 -12 z"/>
    <text class="xd-muted" x="130" y="100" text-anchor="middle" font-size="15" font-style="italic">"let me explain…"</text>
    <!-- big X -->
    <path class="xd-stroke-rubric" stroke-width="3.2" d="M70 60 L200 150"/>
    <path class="xd-stroke-rubric" stroke-width="3.2" d="M200 60 L70 150"/>
  </g>

  <!-- vs -->
  <text class="xd-muted" x="280" y="110" text-anchor="middle" font-size="14" font-weight="700">vs</text>

  <!-- Right: clipboard with checkboxes -->
  <g transform="rotate(-0.8 420 110)">
    <text class="xd-small" x="420" y="32" text-anchor="middle">Checklist</text>
    <!-- clipboard body -->
    <rect class="xd-box-fill" x="330" y="48" width="180" height="120" rx="8"/>
    <!-- clip top -->
    <rect class="xd-box-fill" x="380" y="40" width="80" height="18" rx="5"/>
    <!-- checkboxes -->
    <rect class="xd-box" x="350" y="72" width="16" height="16" rx="3"/>
    <path class="xd-stroke-pass" stroke-width="2.4" d="M353 80 L357 84 L363 74"/>
    <text class="xd-label" x="376" y="85" font-size="13">speech type?</text>

    <rect class="xd-box" x="350" y="100" width="16" height="16" rx="3"/>
    <path class="xd-stroke-pass" stroke-width="2.4" d="M353 108 L357 112 L363 102"/>
    <text class="xd-label" x="376" y="113" font-size="13">claim in 1 line?</text>

    <rect class="xd-box" x="350" y="128" width="16" height="16" rx="3"/>
    <path class="xd-stroke-pass" stroke-width="2.4" d="M353 136 L357 140 L363 130"/>
    <text class="xd-label" x="376" y="141" font-size="13">wake a human?</text>

    <!-- circle around checklist -->
    <ellipse class="xd-stroke-pass" cx="420" cy="112" rx="98" ry="68" stroke-dasharray="5 4" opacity="0.9"/>
  </g>

  <text class="xd-caption" x="280" y="200" text-anchor="middle">Scorer, not essay bot</text>

</svg>
