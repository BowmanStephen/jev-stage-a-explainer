<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="100%" height="auto" role="img" aria-labelledby="title desc">
  <title id="title">Two labs: Stage A warm-up versus Claim-loop product test</title>
  <desc id="desc">Left panel Stage A warm-up with tone and volume. Right panel Claim-loop product test with magnify claim and human. Caption: Tone practice vs claim to human to pushback.</desc>
  <style>
  .xd-bg { fill: #16140F; }
  .xd-box { fill: none; stroke: #EDE8DE; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .xd-box-fill { fill: #16140F; stroke: #EDE8DE; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .xd-dash { fill: none; stroke: #A8A29A; stroke-width: 1.8; stroke-dasharray: 6 5; stroke-linecap: round; }
  .xd-ink { fill: #EDE8DE; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .xd-muted { fill: #A8A29A; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .xd-rubric { fill: #E25545; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .xd-pass { fill: #6FBF8A; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .xd-stroke-rubric { stroke: #E25545; fill: none; stroke-width: 2.2; stroke-linecap: round; }
  .xd-stroke-pass { stroke: #6FBF8A; fill: none; stroke-width: 2.2; stroke-linecap: round; }
  .xd-fill-rubric { fill: none; stroke: #E25545; stroke-width: 2.2; }
  .xd-fill-pass { fill: none; stroke: #6FBF8A; stroke-width: 2.2; }
  .xd-caption { fill: #A8A29A; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-style: italic; }
  .xd-label { fill: #EDE8DE; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; }
  .xd-small { fill: #A8A29A; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; }
</style>
  <rect class="xd-bg" x="0" y="0" width="640" height="240" rx="8"/>

  <!-- Left panel: Stage A -->
  <g>
    <rect class="xd-box-fill" x="24" y="28" width="280" height="160" rx="12"/>
    <text class="xd-label" x="164" y="56" text-anchor="middle" font-size="15">Stage A — warm-up</text>
    <!-- volume / thermometer -->
    <g transform="translate(70, 80)">
      <!-- thermometer -->
      <rect class="xd-box" x="0" y="0" width="14" height="56" rx="7"/>
      <circle class="xd-box" cx="7" cy="62" r="12"/>
      <rect fill="#E25545" x="4" y="30" width="6" height="32" rx="3"/>
      <circle fill="#E25545" cx="7" cy="62" r="7"/>
    </g>
    <!-- volume knob -->
    <g transform="translate(130, 95)">
      <circle class="xd-box" cx="24" cy="24" r="22"/>
      <path class="xd-box" d="M24 24 L24 8"/>
      <path class="xd-dash" d="M4 24 A20 20 0 0 1 44 24" stroke-width="1.4"/>
    </g>
    <text class="xd-small" x="164" y="160" text-anchor="middle">tone · volume · vibe</text>
  </g>

  <!-- divider -->
  <path class="xd-dash" d="M320 40 L320 180"/>

  <!-- Right panel: Claim-loop -->
  <g transform="rotate(0.6 480 108)">
    <rect class="xd-box-fill" x="340" y="28" width="280" height="160" rx="10"/>
    <text class="xd-label" x="480" y="56" text-anchor="middle" font-size="15">Claim-loop — product test</text>
    <!-- magnify over quote -->
    <g transform="translate(380, 78)">
      <rect class="xd-box" x="0" y="8" width="70" height="36" rx="4"/>
      <text class="xd-muted" x="35" y="32" text-anchor="middle" font-size="11">"claim…"</text>
      <circle class="xd-box" cx="78" cy="20" r="14"/>
      <path class="xd-box" d="M88 30 L100 42"/>
    </g>
    <!-- person -->
    <g transform="translate(510, 78)">
      <circle class="xd-box" cx="20" cy="14" r="10"/>
      <path class="xd-box" d="M4 48 q16 -22 32 0"/>
      <text class="xd-small" x="20" y="64" text-anchor="middle">human</text>
    </g>
    <text class="xd-small" x="480" y="168" text-anchor="middle">claim → human → pushback</text>
  </g>

  <text class="xd-caption" x="320" y="220" text-anchor="middle">Tone practice vs claim → human → pushback</text>

</svg>
