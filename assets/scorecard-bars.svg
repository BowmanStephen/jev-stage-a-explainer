<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="100%" height="auto" role="img" aria-labelledby="title desc">
  <title id="title">Scorecard bars: Claim-pull FAIL 2 of 8, Control filter PASS 0 of 4 false alarms, Pushbacks PASS 5 of 5 hold</title>
  <desc id="desc">Three honesty stamps. Claim-pull failed at 2 of 8. Control filter passed with 0 of 4 false alarms. Pushbacks passed 5 of 5 hold. One fail means keep iterating.</desc>
  <style>
  .xd-bg { fill: #16140F; }
  .xd-box { fill: none; stroke: #EDE8DE; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .xd-box-fill { fill: #16140F; stroke: #EDE8DE; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .xd-dash { fill: none; stroke: #A8A29A; stroke-width: 1.8; stroke-dasharray: 6 5; stroke-linecap: round; }
  .xd-ink { fill: #EDE8DE; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .xd-muted { fill: #A8A29A; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .xd-rubric { fill: #E25545; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .xd-pass { fill: #6FBF8A; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .xd-stroke-rubric { stroke: #E25545; fill: none; stroke-width: 2.2; stroke-linecap: round; }
  .xd-stroke-pass { stroke: #6FBF8A; fill: none; stroke-width: 2.2; stroke-linecap: round; }
  .xd-fill-rubric { fill: none; stroke: #E25545; stroke-width: 2.2; }
  .xd-fill-pass { fill: none; stroke: #6FBF8A; stroke-width: 2.2; }
  .xd-caption { fill: #A8A29A; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-style: italic; }
  .xd-label { fill: #EDE8DE; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; }
  .xd-small { fill: #A8A29A; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; }
</style>
  <rect class="xd-bg" x="0" y="0" width="680" height="240" rx="8"/>

  <!-- Stamp 1: Claim-pull FAIL -->
  <g transform="rotate(-1 130 110)">
    <rect class="xd-fill-rubric" x="24" y="36" width="212" height="140" rx="12" stroke-width="3"/>
    <!-- FAIL stamp banner -->
    <rect fill="#E25545" x="48" y="50" width="164" height="28" rx="4"/>
    <text fill="#16140F" x="130" y="70" text-anchor="middle" font-size="16" font-weight="800"
          font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">FAIL</text>
    <text class="xd-label" x="130" y="110" text-anchor="middle" font-size="15">Claim-pull</text>
    <text class="xd-rubric" x="130" y="140" text-anchor="middle" font-size="28" font-weight="800">2/8</text>
    <text class="xd-small" x="130" y="162" text-anchor="middle">need ≥7/8</text>
  </g>

  <!-- Stamp 2: Control filter PASS -->
  <g>
    <rect class="xd-fill-pass" x="254" y="36" width="172" height="140" rx="11" stroke-width="3"/>
    <rect fill="#6FBF8A" x="274" y="50" width="132" height="28" rx="4"/>
    <text fill="#16140F" x="340" y="70" text-anchor="middle" font-size="16" font-weight="800"
          font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">PASS</text>
    <text class="xd-label" x="340" y="110" text-anchor="middle" font-size="14">Control filter</text>
    <text class="xd-pass" x="340" y="138" text-anchor="middle" font-size="22" font-weight="800">0/4</text>
    <text class="xd-small" x="340" y="160" text-anchor="middle">false alarms</text>
  </g>

  <!-- Stamp 3: Pushbacks PASS -->
  <g transform="rotate(1 550 110)">
    <rect class="xd-fill-pass" x="444" y="36" width="212" height="140" rx="12" stroke-width="3"/>
    <rect fill="#6FBF8A" x="488" y="50" width="124" height="28" rx="4"/>
    <text fill="#16140F" x="550" y="70" text-anchor="middle" font-size="16" font-weight="800"
          font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">PASS</text>
    <text class="xd-label" x="550" y="110" text-anchor="middle" font-size="15">Pushbacks</text>
    <text class="xd-pass" x="550" y="140" text-anchor="middle" font-size="28" font-weight="800">5/5</text>
    <text class="xd-small" x="550" y="162" text-anchor="middle">hold</text>
  </g>

  <text class="xd-caption" x="340" y="210" text-anchor="middle">One fail = keep iterating</text>

</svg>
